# Host Nginx site for simetricdigital.com.
# Copy to /etc/nginx/sites-available/simetricdigital.com, enable it, then run certbot.
# Proxies to the web container published on 127.0.0.1:8080 (APP_PORT in .env).

server {
    listen 80;
    listen [::]:80;
    server_name simetricdigital.com www.simetricdigital.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
        # Laravel sends large Link (asset preload) headers.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
